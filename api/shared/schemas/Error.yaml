type: object
required:
  - code
  - message
properties:
  code:
    type: string
    description: Машиночитаемый код ошибки, стабильная константа для обработки на клиенте
    example: VALIDATION_ERROR
  message:
    type: string
    description: Человекочитаемое описание ошибки
    example: "Некорректное значение поля"