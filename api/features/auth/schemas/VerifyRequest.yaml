type: object
required:
  - requestId
  - code
properties:
  requestId:
    type: string
    format: uuid
    description: Идентификатор отправки
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
  code:                                                                                                                                                     
    type: string                                                                                                                                            
    pattern: '^[0-9]{6}$'                                                                                                                                   
    minLength: 6                                                                                                                                            
    maxLength: 6                                                                                                                                            
    description: Шестизначный код из письма                                                                                                                 
    example: "483920" 