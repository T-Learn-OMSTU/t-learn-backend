type: object
description: Карточка пользователя в списке админки
required:
  - id
  - email
  - role
properties:
  id:
    type: integer
    format: int64
    description: Идентификатор пользователя
    example: 42
  email:
    type: string
    format: email
    description: Рабочая почта, на которую пользователь проходит OTP-авторизацию
    example: email@example.com
  role:
    type: string
    description: Роль пользователя
    enum:
      - USER
      - MODERATOR
      - ADMIN
    example: USER