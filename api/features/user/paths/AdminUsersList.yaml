get:
  tags:
    - user
  summary: Список пользователей (админка)
  description: Возвращает постраничный список пользователей для панели администратора/модератора.
  operationId: getAdminUsersList
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Номер страницы, нумерация с 1
      example: 1
    - name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      description: Размер страницы; больше 100 записей за раз запросить нельзя
      example: 50
    - name: search
      in: query
      required: false
      schema:
        type: string
      description: Подстрока для поиска по email, без учёта регистра
      example: ivanov@corp.org
  responses:
    '200':
      description: Страница списка пользователей
      content:
        application/json:
          schema:
            $ref: '../schemas/AdminUsersListResponse.yaml'
    '400':
      $ref: '../../../shared/responses/BadRequest.yaml'
    '401':
      $ref: '../../../shared/responses/Unauthorized.yaml'
    '403':
      $ref: '../../../shared/responses/Forbidden.yaml'