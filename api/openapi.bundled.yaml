openapi: 3.0.3
info:
  title: t-learn API
  version: 0.0.1
  description: Backend API сервиса t-learn
servers:
  - url: http://localhost:8080
    description: Локальная разработка
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Авторизация по OTP-коду, выдача и инвалидация opaque токена
  - name: statistics
    description: Статистика обучения пользователя
  - name: admin
    description: Эндпоинты панели администратора
  - name: vocabulary
    description: Словари для обучения и их администрирование
  - name: learning
    description: Обучение по карточкам и прогресс повторений
paths:
  /api/v1/auth/send:
    post:
      tags:
        - auth
      summary: Отправить OTP-код
      description: Отправляет одноразовый код на указанную почту.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: Код успешно отправлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOtpResponse'
        '400':
          description: Поле email отсутствует/пустое/невалидный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Некорректный формат email
        '429':
          description: Превышен рейтлимит отправок кода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SEND_OTP_RATE_LIMIT_EXCEEDED
                message: Повторная отправка возможна через 45 секунд
  /api/v1/auth/verify:
    post:
      tags:
        - auth
      summary: Проверить OTP код
      description: Проверяет код из письма и возвращает opaque токен доступа
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: OTP код подтвержден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный или просроченный код
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VERIFY_INVALID_OTP
                message: Неверный или просроченный код подтверждения
        '429':
          description: Превышен рейтлимит подтверждений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VERIFY_RATE_LIMIT_EXCEEDED
                message: Повторное подтверждение возможно через 45 секунд
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Выйти из аккаунта
      description: Инвалидирует текущий opaque токен доступа, переданный в заголовке Authorization
      operationId: logout
      responses:
        '204':
          description: Токен успешно инвалидирован
        '401':
          description: Токен отсутствует, недействителен или истек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_TOKEN
                message: Токен отсутствует, недействителен или истек
  /api/v1/statistics/memorized-per-day:
    get:
      summary: Количество выученных слов по дням
      operationId: getMemorizedWordsPerDay
      tags:
        - statistics
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода (включительно)
          example: '2026-10-11'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода (включительно)
          example: '2026-11-10'
      responses:
        '200':
          description: Выученные слова по дням (возвращаются только дни с ненулевым значением)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorizedPerDayResponse'
        '400':
          description: Некорректный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPeriod:
                  value:
                    code: STATISTICS_INVALID_PERIOD
                    message: Дата from позже даты to
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/statistics/vocabularies/{vocabularyId}/progress:
    get:
      summary: Прогресс пользователя по словарю
      operationId: getVocabularyStatistics
      tags:
        - statistics
      parameters:
        - name: vocabularyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Идентификатор словаря
          example: 42
      responses:
        '200':
          description: Счётчики прогресса пользователя по словарю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/statistics/users/{userId}:
    get:
      summary: Статистика пользователя
      operationId: getAdminUserStatistics
      tags:
        - statistics
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Идентификатор пользователя
          example: 42
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода (включительно)
          example: '2026-10-11'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода (включительно)
          example: '2026-11-10'
      responses:
        '200':
          description: Вся статистика пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserStatisticsResponse'
        '400':
          description: Некорректный период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPeriod:
                  value:
                    code: STATISTICS_INVALID_PERIOD
                    message: Дата from позже даты to
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/vocabularies/import:
    post:
      tags:
        - vocabulary
      summary: Импорт словаря из xls
      operationId: importAdminVocabulary
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - file
              properties:
                name:
                  type: string
                  description: Название создаваемого словаря
                  example: Базовый английский
                file:
                  type: string
                  format: binary
                  description: xlsx-файл со словами
      responses:
        '201':
          description: Словарь создан и наполнен словами из файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularySummary'
        '400':
          description: Ошибка валидации запроса или файла импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationError:
                  summary: Невалидные параметры запроса
                  value:
                    code: VALIDATION_ERROR
                    message: Некорректное значение поля
                invalidFile:
                  summary: Файл не читается или нарушен формат колонок
                  value:
                    code: VOCABULARY_IMPORT_INVALID
                    message: 'Строка 17: пустое значение в колонке word'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/vocabularies/{vocabularyId}:
    patch:
      tags:
        - vocabulary
      summary: Переименование словаря
      operationId: updateAdminVocabulary
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Идентификатор словаря
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateVocabularyRequest'
      responses:
        '200':
          description: Словарь переименован; возвращается актуальное состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Словарь с указанным vocabularyId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                vocabularyNotFound:
                  summary: Словарь не найден
                  value:
                    code: VOCABULARY_NOT_FOUND
                    message: Словарь не найден
    delete:
      tags:
        - vocabulary
      summary: Удаление словаря
      operationId: deleteAdminVocabulary
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Идентификатор удаляемого словаря
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '204':
          description: Словарь удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Словарь с указанным vocabularyId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                vocabularyNotFound:
                  summary: Словарь не найден
                  value:
                    code: VOCABULARY_NOT_FOUND
                    message: Словарь не найден
  /api/v1/admin/vocabularies/{vocabularyId}/export:
    get:
      tags:
        - vocabulary
      summary: Выгрузка словаря в xls
      operationId: exportAdminVocabulary
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Идентификатор выгружаемого словаря
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: xlsx-файл со словами словаря
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Словарь с указанным vocabularyId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                vocabularyNotFound:
                  summary: Словарь не найден
                  value:
                    code: VOCABULARY_NOT_FOUND
                    message: Словарь не найден
  /api/v1/admin/vocabularies/{vocabularyId}/words:
    get:
      tags:
        - vocabulary
      summary: Слова словаря
      description: Возвращает постраничный список слов словаря для редактирования в админке.
      operationId: getAdminVocabularyWords
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Идентификатор словаря
          schema:
            type: integer
            format: int64
          example: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          description: Номер страницы, нумерация с 1
          example: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          description: Размер страницы; больше 100 записей за раз запросить нельзя
          example: 50
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Подстрока для поиска по word или translation, без учёта регистра
          example: feel
      responses:
        '200':
          description: Страница списка слов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWordsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Словарь с указанным vocabularyId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                vocabularyNotFound:
                  summary: Словарь не найден
                  value:
                    code: VOCABULARY_NOT_FOUND
                    message: Словарь не найден
    post:
      tags:
        - vocabulary
      summary: Добавление слова в словарь
      operationId: createAdminVocabularyWord
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Идентификатор словаря, в который добавляется слово
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateWordRequest'
      responses:
        '201':
          description: Слово добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Word'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Словарь с указанным vocabularyId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                vocabularyNotFound:
                  summary: Словарь не найден
                  value:
                    code: VOCABULARY_NOT_FOUND
                    message: Словарь не найден
        '409':
          description: Слово с таким написанием уже есть в этом словаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wordDuplicate:
                  summary: Дубликат слова в словаре
                  value:
                    code: VOCABULARY_WORD_DUPLICATE
                    message: Слово уже есть в словаре
  /api/v1/admin/words/{wordId}:
    patch:
      tags:
        - vocabulary
      summary: Редактирование слова
      operationId: updateAdminWord
      parameters:
        - name: wordId
          in: path
          required: true
          description: Идентификатор слова
          schema:
            type: integer
            format: int64
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateWordRequest'
      responses:
        '200':
          description: Слово обновлено; возвращается актуальное состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Word'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Слово с указанным wordId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wordNotFound:
                  summary: Слово не найдено
                  value:
                    code: VOCABULARY_WORD_NOT_FOUND
                    message: Слово не найдено
        '409':
          description: Слово с таким написанием уже есть в этом словаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wordDuplicate:
                  summary: Дубликат слова в словаре
                  value:
                    code: VOCABULARY_WORD_DUPLICATE
                    message: Слово уже есть в словаре
    delete:
      tags:
        - vocabulary
      summary: Удаление слова
      operationId: deleteAdminWord
      parameters:
        - name: wordId
          in: path
          required: true
          description: Идентификатор удаляемого слова
          schema:
            type: integer
            format: int64
          example: 12345
      responses:
        '204':
          description: Слово удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Слово с указанным wordId не существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wordNotFound:
                  summary: Слово не найдено
                  value:
                    code: VOCABULARY_WORD_NOT_FOUND
                    message: Слово не найдено
  /api/v1/learning/cards/next:
    get:
      tags:
        - learning
      operationId: getLearningNextCard
      summary: Следующая карточка обучения
      responses:
        '200':
          description: Следующая карточка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '204':
          description: Нет карточек для показа (всё выучено, ротация не дозрела или словарь пуст).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/learning/words/{wordId}/answer:
    post:
      tags:
        - learning
      operationId: answerLearningWord
      summary: Ответ на карточку
      parameters:
        - name: wordId
          in: path
          required: true
          description: Слово, по которому отправляется ответ (из карточки).
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Ответ принят, актуальное состояние прогресса по слову.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Действие не соответствует текущему состоянию слова на сервере.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                actionNotAllowed:
                  summary: Экшн не подходит типу карточки
                  value:
                    code: LEARNING_ACTION_NOT_ALLOWED
                    message: Действие недопустимо для текущего состояния слова
                stageConflict:
                  summary: Этап на сервере не совпал с expectedStage (ответ из другой вкладки)
                  value:
                    code: LEARNING_STAGE_CONFLICT
                    message: Состояние слова изменилось, запросите карточку заново
  /api/v1/learning/progress/vocabularies/{vocabularyId}/reset:
    post:
      tags:
        - learning
      operationId: resetLearningVocabularyProgress
      summary: Сброс прогресса по словарю
      parameters:
        - name: vocabularyId
          in: path
          required: true
          description: Словарь, по которому сбрасывается прогресс.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Прогресс по словарю сброшен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/learning/progress/reset-all:
    post:
      tags:
        - learning
      operationId: resetLearningAllProgress
      summary: Сброс всего прогресса обучения
      responses:
        '200':
          description: Весь прогресс обучения сброшен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque токен доступа, полученный на /api/v1/auth/verify
  schemas:
    SendOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Почта, на которую отправляется код
          example: user@example.com
    SendOtpResponse:
      type: object
      required:
        - requestId
        - expiresIn
        - retryAfter
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор отправки
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        expiresIn:
          type: integer
          format: int32
          description: Время жизни кода в секундах
          example: 300
        retryAfter:
          type: integer
          format: int32
          description: Через сколько секунд можно запросить код повторно
          example: 60
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки, стабильная константа для обработки на клиенте
          example: VALIDATION_ERROR
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: Некорректное значение поля
    VerifyRequest:
      type: object
      required:
        - requestId
        - code
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор отправки
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        code:
          type: string
          pattern: ^[0-9]{6}$
          minLength: 6
          maxLength: 6
          description: Шестизначный код из письма
          example: '483920'
    VerifyResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Opaque токен доступа, передается в заголовке Authorization
          example: 9f2c1b7a4d6e8f0a3b5c7d9e1f2a4b6c
        tokenType:
          type: string
          description: Тип токена, всегда Bearer
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          format: int32
          description: Время жизни токена в секундах
          example: 2592000
    MemorizedPerDayResponse:
      type: array
      items:
        type: object
        required:
          - date
          - count
        properties:
          date:
            type: string
            format: date
            example: '2026-11-07'
          count:
            type: integer
            format: int32
            minimum: 0
            example: 6
    VocabProgressResponse:
      type: object
      required:
        - alreadyKnow
        - inProgress
        - memorized
        - remaining
        - total
      properties:
        alreadyKnow:
          type: integer
          format: int32
          description: Сколько слов пользователь уже знал (не попали в ротацию)
          minimum: 0
          example: 52
        inProgress:
          type: integer
          format: int32
          description: Сколько слов уже попали в ротацию, но пользователь их еще не выучил
          minimum: 0
          example: 1
        memorized:
          type: integer
          format: int32
          description: Сколько слов из числа тех, что попали в ротацию, пользователь выучил
          minimum: 0
          example: 7
        remaining:
          type: integer
          format: int32
          description: Сколько слов из словаря пользователь не видел вообще
          minimum: 0
          example: 25
        total:
          type: integer
          format: int32
          description: Всего слов в словаре
          minimum: 0
          example: 1488
    AdminUserStatisticsResponse:
      type: object
      required:
        - userId
        - memorizedPerDay
        - vocabularies
      properties:
        userId:
          type: integer
          format: int64
        memorizedPerDay:
          $ref: '#/components/schemas/MemorizedPerDayResponse'
        vocabularies:
          type: array
          description: Статистика по словарям, с которыми пользователь работал
          items:
            allOf:
              - $ref: '#/components/schemas/VocabProgressResponse'
              - type: object
                required:
                  - vocabularyId
                properties:
                  vocabularyId:
                    type: integer
                    format: int64
    VocabularySummary:
      type: object
      description: Словарь в каталоге - набор слов для обучения
      required:
        - id
        - name
        - wordsCount
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор словаря
          example: 1
        name:
          type: string
          description: Название словаря, отображается пользователю при выборе
          example: Базовый английский
        wordsCount:
          type: integer
          format: int32
          minimum: 0
          description: Количество слов в словаре
          example: 1500
    AdminUpdateVocabularyRequest:
      type: object
      description: Изменения словаря
      required:
        - name
      properties:
        name:
          type: string
          description: Новое название словаря, отображается пользователю при выборе
          example: Базовый английский
    Word:
      type: object
      description: Слово словаря
      required:
        - id
        - word
        - translation
        - transcription
        - type
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор слова
          example: 67
        word:
          type: string
          description: Английское написание слова
          example: feel
        transcription:
          type: string
          description: Транскрипция английского слова
          example: fil
        translation:
          type: string
          description: Перевод на русский
          example: чувствовать
        type:
          type: string
          enum:
            - NOUN
            - ADJECTIVE
            - VERB
            - PRONOUN
            - ADVERB
          example: NOUN
    AdminWordsListResponse:
      type: object
      description: Страница списка слов словаря
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          description: Слова текущей страницы; пустой массив, если страница за пределами диапазона
          items:
            $ref: '#/components/schemas/Word'
        total:
          type: integer
          format: int32
          minimum: 0
          description: Общее число слов в словаре с учётом фильтра search; фронту нужно для отрисовки
          example: 1500
        page:
          type: integer
          format: int32
          minimum: 1
          description: Номер возвращённой страницы
          example: 1
        size:
          type: integer
          format: int32
          minimum: 1
          description: Размер страницы
          example: 50
    AdminCreateWordRequest:
      type: object
      description: Слово словаря (без id для создания в словаре)
      required:
        - word
        - translation
        - transcription
        - type
      properties:
        word:
          type: string
          description: Английское написание слова
          example: feel
        transcription:
          type: string
          description: Транскрипция английского слова
          example: fil
        translation:
          type: string
          description: Перевод на русский
          example: чувствовать
        type:
          type: string
          enum:
            - NOUN
            - ADJECTIVE
            - VERB
            - PRONOUN
            - ADVERB
          example: NOUN
    AdminUpdateWordRequest:
      type: object
      description: Изменения слова; передаются только изменяемые поля, минимум одно
      minProperties: 1
      properties:
        word:
          type: string
          description: Английское написание слова
          example: feel
        transcription:
          type: string
          description: Транскрипция английского слова
          example: fil
        translation:
          type: string
          description: Перевод на русский
          example: чувствовать
        type:
          type: string
          enum:
            - NOUN
            - ADJECTIVE
            - VERB
            - PRONOUN
            - ADVERB
          example: NOUN
    NewCard:
      type: object
      required:
        - cardType
        - direction
        - word
      properties:
        cardType:
          type: string
          enum:
            - NEW
        direction:
          type: string
          enum:
            - EN_RU
        word:
          $ref: '#/components/schemas/Word'
    RotationCard:
      type: object
      required:
        - cardType
        - direction
        - word
        - stage
        - totalStages
        - penaltyStep
      properties:
        cardType:
          type: string
          enum:
            - ROTATION
        direction:
          type: string
          enum:
            - EN_RU
            - RU_EN
          description: Направление перевода, выбирается сервером случайно при каждом показе
        word:
          $ref: '#/components/schemas/Word'
        stage:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
          description: Текущий этап повторения (отображается в углу карточки)
          example: 3
        totalStages:
          type: integer
          format: int32
          description: Всего этапов повторения до статуса «выучено»
          example: 8
        penaltyStep:
          type: integer
          format: int32
          enum:
            - 0
            - 1
            - 2
          description: Шаг штрафного повторения после «не запомнил» (0 — не в штрафе, 1 — повтор через 5 минут, 2 — через 1 час)
          example: 0
    Card:
      oneOf:
        - $ref: '#/components/schemas/NewCard'
        - $ref: '#/components/schemas/RotationCard'
      discriminator:
        propertyName: cardType
        mapping:
          NEW: '#/components/schemas/NewCard'
          ROTATION: '#/components/schemas/RotationCard'
    AnswerRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - KNOW
            - UNKNOWN
            - REMEMBERED
            - FORGOT
          example: REMEMBERED
        expectedStage:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
          example: 3
    AnswerResponse:
      type: object
      description: Актуальное состояние прогресса по слову после обработки ответа.
      required:
        - id
        - status
        - stage
        - dueAt
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        status:
          type: string
          enum:
            - KNOWN
            - IN_ROTATION
            - LEARNED
          example: IN_ROTATION
        stage:
          type: integer
          format: int32
          minimum: 0
          maximum: 8
          example: 4
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: Когда карточка дозреет к показу. null для KNOWN, LEARNED.
          example: '2026-11-19T10:30:00Z'
    ResetProgressResponse:
      type: object
      required:
        - resetCount
      properties:
        resetCount:
          type: integer
          format: int32
          minimum: 0
          description: Количество удалённых записей прогресса. 0 — прогресса не было
          example: 52
  responses:
    BadRequest:
      description: Ошибка валидации запроса (невалидное значение поля, отсутствует обязательное поле, нарушен формат данных)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Некорректное значение поля
    Unauthorized:
      description: Не авторизован (токен отсутствует или недействителен)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Требуется авторизация
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Ресурс не найден
    Forbidden:
      description: Доступ запрещён (недостаточно прав)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав для выполнения операции
